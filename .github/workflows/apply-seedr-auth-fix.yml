name: Apply Seedr auth fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix Seedr device authorization client ID') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Seedr authorization client ID fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("backend/main.py")
          s = p.read_text()
          old = """            # Seedr's device authorization endpoint expects the original
            # device_code. The current Seedr client implementations pass only
            # device_code here; do not add client_id to this request.
            response = await client.get(
                SEEDR_DEVICE_AUTHORIZE_URL,
                params={"device_code": device_code},
                headers={"Accept": "application/json"},
            )"""
          new = """            # Seedr's device authorization endpoint requires both the
            # device_code and the same client_id used to create the device.
            response = await client.get(
                SEEDR_DEVICE_AUTHORIZE_URL,
                params={
                    "client_id": SEEDR_DEVICE_CLIENT_ID,
                    "device_code": device_code,
                },
                headers={"Accept": "application/json"},
            )"""
          if old not in s:
              print("Seedr auth block already patched.")
              raise SystemExit(0)
          p.write_text(s.replace(old, new))
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/main.py
          git commit -m "Fix Seedr device authorization client ID"
          git push
